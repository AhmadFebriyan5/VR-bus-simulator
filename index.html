<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Bus Simulator - Palembang</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div id="h-speed">SPD: 0 km/h</div>
  <div id="h-gear">GIGI: N</div>
  <div id="h-route">RUTE: Ampera - Jakabaring</div>
</div>

<div id="dashboard">
  <button class="dbtn" onclick="toggleEngine()">MESIN</button>
  <button class="dbtn" onclick="honk()">KLAKSON</button>
  <button class="dbtn" onclick="openDoor()">PINTU</button>
  <button class="dbtn" onclick="toggleLight()">LAMPU</button>
  <button class="dbtn" onclick="changeCam()">KAMERA</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="js/scene.js"></script>
<script src="js/world.js"></script>
<script src="js/bus.js"></script>
<script src="js/controls.js"></script>
<script src="js/ui.js"></script>
<script src="js/vr.js"></script>
<script src="js/speedometer.js"></script>
<script src="js/main.js"></script>

</body>
</html>
